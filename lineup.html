                    <option value="psychedelic pop/rock">Psychedelic Pop</option>
                    <option value="electropop">Electro Pop</option>
                </select>
            </div>
            <div>

                    <option value="Mid">Medium Stage</option>

                </select>
            </div> 
            <div>

                    <option value="Afternoon">Afternoon</option>
                    <option value="Night">Night</option>
                </select>
            </div>
            <div>
            <select class="filter-bar" id="day-dropdown" name="Time">

                <option value="1">Day 1</option>
                <option value="2">Day 2</option>
                <option value="3">Day 3</option>
                <option value="4">Day 4</option>
                <option value="5">Day 5</option>
            </select>
            </div>
            <div class="search-bar">
                <input type="text" class="searchfield" id="searchBar" placeholder="Search by name..." autocomplete="off">
